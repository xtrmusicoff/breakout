<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  :root {
    /* Game width: 800px at most, and shrinks so the whole page fits the window */
    --game-w: max(320px, min(800px, calc(100vw - 40px), calc((100vh - 260px) * 4 / 3)));
  }
  body {
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  #hud {
    width: var(--game-w);
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-bottom: 8px;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    box-sizing: border-box;
    width: var(--game-w);
    height: auto;
    cursor: none;
  }
  #controls {
    color: #888;
    font-size: 14px;
    line-height: 1.7;
    margin: 12px 0 4px;
  }
  #controls li { list-style: none; }
  #controls kbd {
    display: inline-block;
    min-width: 28px;
    padding: 1px 6px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #222;
    color: #ccc;
    text-align: center;
    font-family: inherit;
  }
  #endless-status { font-size: 15px; font-weight: bold; color: #eee; margin: 6px 0 0; }
</style>
</head>
<body>
  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Lives: <span id="lives">3</span></span>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <ul id="controls">
    <li><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> &nbsp;or&nbsp; mouse: move paddle</li>
    <li><kbd>Space</kbd> or click: launch ball (and restart after game over)</li>
    <li><kbd>P</kbd>: pause / resume</li>
    <li><kbd>M</kbd>: mute / unmute sound</li>
    <li><kbd>I</kbd>: toggle Endless mode (before starting)</li>
  </ul>
  <p id="endless-status">Endless: OFF</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Settings
const PADDLE_W = 100;
const PADDLE_H = 12;
const PADDLE_Y = H - 30;
const PADDLE_SPEED = 8;
const BALL_R = 8;
const BALL_SPEED = 5;
const BRICK_ROWS = 5;
const BRICK_COLS = 10;
const BRICK_H = 20;
const BRICK_GAP = 4;
const BRICK_MARGIN = 20;
const BRICK_TOP = 60;
const BRICK_W = (W - 2 * BRICK_MARGIN - (BRICK_COLS - 1) * BRICK_GAP) / BRICK_COLS;
const ROW_COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db'];
const PARTICLES_PER_BRICK = 14;

// State: 'ready' (ball on paddle), 'playing', 'over', 'won'
let paddle, ball, bricks, score, lives, state;
let particles = [];
let muted = false;

// Endless mode
let endless = false;
let ballSpeed = BALL_SPEED;
let milestonesReached = 0;
let lastFrameTime = null;
const ENDLESS_RESTORE_MS = 60000;   // broken bricks come back every minute
const MILESTONE_POINTS = 200;       // speed-up every 200 points
const MILESTONE_SPEED_STEP = 0.5;
const MAX_BALL_SPEED = 12;          // keeps the ball from skipping through the paddle

// Sound effects
const sounds = {
  platform: new Audio('sounds/platform.mp3'),
  wall: new Audio('sounds/wall.mp3'),
  brick: new Audio('sounds/brick.mp3')
};

function playSound(name) {
  if (muted) return;
  const s = sounds[name];
  s.currentTime = 0;
  s.play().catch(() => {}); // ignore errors, e.g. autoplay blocked
}
const keys = {};

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function makeBricks() {
  const list = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      list.push({
        x: BRICK_MARGIN + c * (BRICK_W + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W,
        h: BRICK_H,
        color: ROW_COLORS[r],
        alive: true,
        points: (BRICK_ROWS - r) * 10,
        restoreIn: 0 // ms left until this brick returns (Endless mode)
      });
    }
  }
  return list;
}

function placeBallOnPaddle() {
  ball = {
    x: paddle.x + paddle.w / 2,
    y: PADDLE_Y - BALL_R,
    dx: 0,
    dy: 0
  };
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function newGame() {
  paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W };
  bricks = makeBricks();
  score = 0;
  lives = endless ? 1 : 3;
  state = 'ready';
  particles = [];
  ballSpeed = BALL_SPEED;
  milestonesReached = 0;
  placeBallOnPaddle();
  updateHud();
}

function launchBall() {
  // Launch at a slight random angle, up and away from vertical
  const angle = (Math.random() * 0.6 - 0.3);
  ball.dx = ballSpeed * Math.sin(angle);
  ball.dy = -ballSpeed * Math.cos(angle);
  state = 'playing';
}

// Each broken brick has its own countdown and returns when it reaches zero
function updateEndless(dt) {
  for (const b of bricks) {
    if (b.alive) continue;
    b.restoreIn -= dt;
    if (b.restoreIn <= 0) b.alive = true;
  }
}

function setBallSpeed(newSpeed) {
  const ratio = newSpeed / ballSpeed;
  ballSpeed = newSpeed;
  ball.dx *= ratio;
  ball.dy *= ratio;
}

function checkMilestones() {
  const reached = Math.floor(score / MILESTONE_POINTS);
  while (milestonesReached < reached) {
    milestonesReached++;
    if (ballSpeed < MAX_BALL_SPEED) {
      setBallSpeed(Math.min(ballSpeed + MILESTONE_SPEED_STEP, MAX_BALL_SPEED));
    }
  }
}

function togglePause() {
  if (state === 'playing') state = 'paused';
  else if (state === 'paused') state = 'playing';
}

function handleAction() {
  if (state === 'ready') launchBall();
  else if (state === 'over' || state === 'won') newGame();
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < PARTICLES_PER_BRICK; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3.5;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color: color
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08; // gravity
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function update() {
  if (state === 'paused') return;

  // Keyboard paddle movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= PADDLE_SPEED;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += PADDLE_SPEED;
  paddle.x = clamp(paddle.x, 0, W - paddle.w);

  updateParticles();

  if (state === 'ready') {
    ball.x = paddle.x + paddle.w / 2;
    return;
  }
  if (state !== 'playing') return;

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Side and top walls
  if (ball.x - BALL_R < 0) { ball.x = BALL_R; ball.dx = -ball.dx; playSound('wall'); }
  if (ball.x + BALL_R > W) { ball.x = W - BALL_R; ball.dx = -ball.dx; playSound('wall'); }
  if (ball.y - BALL_R < 0) { ball.y = BALL_R; ball.dy = -ball.dy; playSound('wall'); }

  // Paddle: bounce angle depends on where the ball hits it
  if (ball.dy > 0 &&
      ball.y + BALL_R >= PADDLE_Y &&
      ball.y - BALL_R <= PADDLE_Y + PADDLE_H &&
      ball.x >= paddle.x - BALL_R &&
      ball.x <= paddle.x + paddle.w + BALL_R) {
    const hit = clamp((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    const maxAngle = Math.PI / 3; // 60 degrees from vertical
    const angle = hit * maxAngle;
    ball.dx = ballSpeed * Math.sin(angle);
    ball.dy = -ballSpeed * Math.cos(angle);
    ball.y = PADDLE_Y - BALL_R;
    playSound('platform');
  }

  // Bricks: circle vs rectangle, one brick per frame
  for (const b of bricks) {
    if (!b.alive) continue;
    const nearX = clamp(ball.x, b.x, b.x + b.w);
    const nearY = clamp(ball.y, b.y, b.y + b.h);
    const ox = ball.x - nearX;
    const oy = ball.y - nearY;
    if (ox * ox + oy * oy < BALL_R * BALL_R) {
      b.alive = false;
      score += b.points;
      if (endless) {
        b.restoreIn = ENDLESS_RESTORE_MS;
        checkMilestones();
      }
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color);
      playSound('brick');
      // Reflect along the axis with the smaller penetration
      if (Math.abs(ox) > Math.abs(oy)) ball.dx = -ball.dx;
      else ball.dy = -ball.dy;
      updateHud();
      break;
    }
  }

  if (!endless && bricks.every(b => !b.alive)) {
    state = 'won';
    return;
  }

  // Ball fell past the paddle
  if (ball.y - BALL_R > H) {
    lives--;
    updateHud();
    if (lives <= 0) {
      state = 'over';
    } else {
      state = 'ready';
      placeBallOnPaddle();
    }
  }
}

function drawCenterText(title, subtitle) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, H / 2 - 60, W, 120);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Arial';
  ctx.fillText(title, W / 2, H / 2);
  ctx.font = '18px Arial';
  ctx.fillText(subtitle, W / 2, H / 2 + 35);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Bricks: base color, light top edge, dark bottom edge for a raised look
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(b.x, b.y, b.w, 4);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
  }

  // Particles from broken bricks
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#ddd';
  ctx.fillRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H);

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();

  if (state === 'ready') drawCenterText('BREAKOUT', 'Press Space or click to launch');
  if (state === 'over') {
    drawCenterText('GAME OVER', endless ? 'Final score: ' + score + '  |  Press Space to play again' : 'Press Space to play again');
  }
  if (state === 'won') drawCenterText('YOU WIN!', 'Press Space to play again');
  if (state === 'paused') drawCenterText('PAUSED', 'Press P to resume');
}

function loop(now) {
  const dt = lastFrameTime === null ? 0 : Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  if (endless && state === 'playing') updateEndless(dt);
  update();
  draw();
  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === ' ') handleAction();
  if (e.repeat) return;
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') muted = !muted;
  if ((e.key === 'i' || e.key === 'I') && state === 'ready') {
    endless = !endless;
    lives = endless ? 1 : 3;
    document.getElementById('endless-status').textContent = 'Endless: ' + (endless ? 'ON' : 'OFF');
    updateHud();
  }
});
document.addEventListener('keyup', e => {
  keys[e.key] = false;
});

// Mouse
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
});
canvas.addEventListener('click', handleAction);

newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
