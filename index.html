<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  :root {
    /* Game width: 800px at most, and shrinks so the whole page fits the window */
    --game-w: max(320px, min(800px, calc(100vw - 40px), calc((100vh - 260px) * 4 / 3)));
  }
  body {
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  #hud {
    width: var(--game-w);
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    margin-bottom: 8px;
  }
  canvas {
    background: #000;
    border: 2px solid #444;
    box-sizing: border-box;
    width: var(--game-w);
    height: auto;
    cursor: none;
  }
  #controls {
    color: #888;
    font-size: 14px;
    line-height: 1.7;
    margin: 12px 0 4px;
  }
  #controls li { list-style: none; }
  #controls kbd {
    display: inline-block;
    min-width: 28px;
    padding: 1px 6px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #222;
    color: #ccc;
    text-align: center;
    font-family: inherit;
  }
  #endless-status { font-size: 15px; font-weight: bold; color: #eee; margin: 6px 0 0; }
</style>
</head>
<body>
  <div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Lives: <span id="lives">3</span></span>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <ul id="controls">
    <li><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> &nbsp;or&nbsp; mouse: move paddle</li>
    <li><kbd>Space</kbd> or click: launch ball (and restart after game over)</li>
    <li><kbd>P</kbd>: pause / resume</li>
    <li><kbd>M</kbd>: mute / unmute sound</li>
    <li><kbd>I</kbd>: toggle Endless mode (before starting)</li>
  </ul>
  <p id="endless-status">Endless: OFF</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Settings
const PADDLE_W = 100;
const PADDLE_H = 12;
const PADDLE_Y = H - 30;
const PADDLE_SPEED = 8;
const BALL_R = 8;
const BALL_SPEED = 5;
const BRICK_ROWS = 5;
const BRICK_COLS = 10;
const BRICK_H = 20;
const BRICK_GAP = 4;
const BRICK_MARGIN = 20;
const BRICK_TOP = 60;
const BRICK_W = (W - 2 * BRICK_MARGIN - (BRICK_COLS - 1) * BRICK_GAP) / BRICK_COLS;
const ROW_COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db'];
const PARTICLES_PER_BRICK = 14;

// Power-ups
const POWERUP_DROP_CHANCE = 0.15;   // chance a broken brick drops a capsule
const CAPSULE_W = 28;
const CAPSULE_H = 16;
const CAPSULE_SPEED = 2.5;          // px per frame
const WIDE_FACTOR = 1.6;            // wide paddle is 60% wider
const WIDE_MS = 10000;
const SLOW_FACTOR = 0.6;            // slow ball moves at 60% speed
const SLOW_MS = 6000;
const MAX_EXTRA_BALLS = 4;
const MULTI_SPLIT_ANGLE = 0.45;     // radians the extra balls split off by
const POWERUP_TYPES = {
  W: { color: '#9b59b6', name: 'wide paddle' },
  M: { color: '#1abc9c', name: 'multi-ball' },
  S: { color: '#e84393', name: 'slow ball' }
};

// State: 'ready' (ball on paddle), 'playing', 'paused', 'over', 'won'
let paddle, ball, extraBalls, capsules, bricks, score, lives, state;
let particles = [];
let muted = false;
let mouseTargetX = null; // paddle X the mouse last asked for (null = mouse not used yet)
let mouseInside = false; // true while the cursor is over the game canvas
let needsGlide = false;  // true when the paddle must glide to the mouse instead of snapping
const MOUSE_GLIDE_SPEED = 12; // max px per frame for gliding to the mouse
let wideLeft = 0;        // ms of wide paddle left
let slowLeft = 0;        // ms of slow ball left

// Endless mode
let endless = false;
let ballSpeed = BALL_SPEED;
let milestonesReached = 0;
let lastFrameTime = null;
const ENDLESS_RESTORE_MS = 60000;   // broken bricks come back every minute
const MILESTONE_POINTS = 200;       // speed-up every 200 points
const MILESTONE_SPEED_STEP = 0.5;
const MAX_BALL_SPEED = 12;          // keeps the ball from skipping through the paddle

// Sound effects
const sounds = {
  platform: new Audio('sounds/platform.mp3'),
  wall: new Audio('sounds/wall.mp3'),
  brick: new Audio('sounds/brick.mp3'),
  powerup: new Audio('sounds/powerup.mp3'),
  powerup_lose: new Audio('sounds/powerup_lose.mp3')
};

function playSound(name) {
  if (muted) return;
  const s = sounds[name];
  s.currentTime = 0;
  s.play().catch(() => {}); // ignore errors, e.g. autoplay blocked
}
const keys = {};

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function makeBricks() {
  const list = [];
  for (let r = 0; r < BRICK_ROWS; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      list.push({
        x: BRICK_MARGIN + c * (BRICK_W + BRICK_GAP),
        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W,
        h: BRICK_H,
        color: ROW_COLORS[r],
        alive: true,
        points: (BRICK_ROWS - r) * 10,
        restoreIn: 0 // ms left until this brick returns (Endless mode)
      });
    }
  }
  return list;
}

function placeBallOnPaddle() {
  ball = {
    x: paddle.x + paddle.w / 2,
    y: PADDLE_Y - BALL_R,
    dx: 0,
    dy: 0
  };
}

function updateHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function newGame() {
  paddle = { x: (W - PADDLE_W) / 2, w: PADDLE_W };
  bricks = makeBricks();
  score = 0;
  lives = endless ? 1 : 3;
  state = 'ready';
  particles = [];
  extraBalls = [];
  capsules = [];
  wideLeft = 0;
  slowLeft = 0;
  ballSpeed = BALL_SPEED;
  milestonesReached = 0;
  placeBallOnPaddle();
  updateHud();
}

function launchBall() {
  // Launch at a slight random angle, up and away from vertical
  const angle = (Math.random() * 0.6 - 0.3);
  ball.dx = ballSpeed * Math.sin(angle);
  ball.dy = -ballSpeed * Math.cos(angle);
  state = 'playing';
}

// Each broken brick has its own countdown and returns when it reaches zero
function updateEndless(dt) {
  for (const b of bricks) {
    if (b.alive) continue;
    b.restoreIn -= dt;
    if (b.restoreIn <= 0) b.alive = true;
  }
}

function allBalls() {
  return [ball, ...extraBalls];
}

function setBallSpeed(newSpeed) {
  const ratio = newSpeed / ballSpeed;
  ballSpeed = newSpeed;
  for (const b of allBalls()) {
    b.dx *= ratio;
    b.dy *= ratio;
  }
}

function checkMilestones() {
  const reached = Math.floor(score / MILESTONE_POINTS);
  while (milestonesReached < reached) {
    milestonesReached++;
    if (ballSpeed < MAX_BALL_SPEED) {
      setBallSpeed(Math.min(ballSpeed + MILESTONE_SPEED_STEP, MAX_BALL_SPEED));
    }
  }
}

// Power-ups ----------------------------------------------------------

// Called every playing frame: counts down timers and sets the paddle width
function tickPowerups(dt) {
  const wasWide = wideLeft > 0;
  const wasSlow = slowLeft > 0;
  wideLeft = Math.max(0, wideLeft - dt);
  slowLeft = Math.max(0, slowLeft - dt);
  if (wasWide && wideLeft === 0) playSound('powerup_lose');
  if (wasSlow && slowLeft === 0) playSound('powerup_lose');
  const newW = wideLeft > 0 ? PADDLE_W * WIDE_FACTOR : PADDLE_W;
  if (newW !== paddle.w) {
    const center = paddle.x + paddle.w / 2; // keep the paddle centered when it resizes
    paddle.w = newW;
    paddle.x = clamp(center - newW / 2, 0, W - newW);
  }
}

// Adds two balls that split off the main ball at an angle
function spawnExtraBalls() {
  for (const sign of [-1, 1]) {
    if (extraBalls.length >= MAX_EXTRA_BALLS) break;
    const a = sign * MULTI_SPLIT_ANGLE;
    const cos = Math.cos(a);
    const sin = Math.sin(a);
    extraBalls.push({
      x: ball.x,
      y: ball.y,
      dx: ball.dx * cos - ball.dy * sin,
      dy: ball.dx * sin + ball.dy * cos
    });
  }
}

// Catching a timed power-up that is already active restarts its timer
function applyPowerup(type) {
  playSound('powerup');
  if (type === 'W') wideLeft = WIDE_MS;
  if (type === 'M') spawnExtraBalls();
  if (type === 'S') slowLeft = SLOW_MS;
}

// Capsules fall; catching one with the paddle applies it
function updateCapsules() {
  capsules = capsules.filter(c => {
    c.y += CAPSULE_SPEED;
    const caught =
      c.y + CAPSULE_H / 2 >= PADDLE_Y &&
      c.y - CAPSULE_H / 2 <= PADDLE_Y + PADDLE_H &&
      c.x + CAPSULE_W / 2 >= paddle.x &&
      c.x - CAPSULE_W / 2 <= paddle.x + paddle.w;
    if (caught) {
      applyPowerup(c.type);
      return false;
    }
    return c.y - CAPSULE_H / 2 <= H; // drop it once it leaves the bottom
  });
}

// ---------------------------------------------------------------------

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
  } else if (state === 'paused') {
    state = 'playing';
    needsGlide = true; // catch up to the mouse smoothly after unpausing
  }
}

function handleAction() {
  if (state === 'ready') launchBall();
  else if (state === 'over' || state === 'won') newGame();
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < PARTICLES_PER_BRICK; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3.5;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 3,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      color: color
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08; // gravity
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// Moves one ball for this frame: walls, paddle, bricks. Returns 'fell' if it went past the paddle.
function stepBall(b) {
  const f = slowLeft > 0 ? SLOW_FACTOR : 1;
  b.x += b.dx * f;
  b.y += b.dy * f;

  // Side and top walls
  if (b.x - BALL_R < 0) { b.x = BALL_R; b.dx = -b.dx; playSound('wall'); }
  if (b.x + BALL_R > W) { b.x = W - BALL_R; b.dx = -b.dx; playSound('wall'); }
  if (b.y - BALL_R < 0) { b.y = BALL_R; b.dy = -b.dy; playSound('wall'); }

  // Paddle: bounce angle depends on where the ball hits it
  if (b.dy > 0 &&
      b.y + BALL_R >= PADDLE_Y &&
      b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
      b.x >= paddle.x - BALL_R &&
      b.x <= paddle.x + paddle.w + BALL_R) {
    const hit = clamp((b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1);
    const maxAngle = Math.PI / 3; // 60 degrees from vertical
    const angle = hit * maxAngle;
    b.dx = ballSpeed * Math.sin(angle);
    b.dy = -ballSpeed * Math.cos(angle);
    b.y = PADDLE_Y - BALL_R;
    playSound('platform');
  }

  // Bricks: circle vs rectangle, one brick per frame
  for (const br of bricks) {
    if (!br.alive) continue;
    const nearX = clamp(b.x, br.x, br.x + br.w);
    const nearY = clamp(b.y, br.y, br.y + br.h);
    const ox = b.x - nearX;
    const oy = b.y - nearY;
    if (ox * ox + oy * oy < BALL_R * BALL_R) {
      br.alive = false;
      score += br.points;
      if (endless) {
        br.restoreIn = ENDLESS_RESTORE_MS;
        checkMilestones();
      }
      if (Math.random() < POWERUP_DROP_CHANCE) {
        const types = Object.keys(POWERUP_TYPES);
        capsules.push({
          x: br.x + br.w / 2,
          y: br.y + br.h / 2,
          type: types[Math.floor(Math.random() * types.length)]
        });
      }
      spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color);
      playSound('brick');
      // Reflect along the axis with the smaller penetration
      if (Math.abs(ox) > Math.abs(oy)) b.dx = -b.dx;
      else b.dy = -b.dy;
      updateHud();
      break;
    }
  }

  return b.y - BALL_R > H ? 'fell' : 'ok';
}

function update() {
  if (state === 'paused') return;

  // Keyboard paddle movement (using the keys hands control back from the mouse)
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { paddle.x -= PADDLE_SPEED; mouseTargetX = null; needsGlide = true; }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { paddle.x += PADDLE_SPEED; mouseTargetX = null; needsGlide = true; }
  paddle.x = clamp(paddle.x, 0, W - paddle.w);

  // Mouse control: while the cursor is over the field, the paddle follows its X position in real time.
  // When needsGlide is set (cursor re-entered, unpaused, or keys used), it glides instead of snapping.
  if (mouseInside && mouseTargetX !== null) {
    if (needsGlide) {
      const diff = mouseTargetX - paddle.x;
      if (Math.abs(diff) <= MOUSE_GLIDE_SPEED) {
        paddle.x = mouseTargetX;
        needsGlide = false;
      } else {
        paddle.x += Math.sign(diff) * MOUSE_GLIDE_SPEED;
      }
    } else {
      paddle.x = mouseTargetX;
    }
  }

  updateParticles();

  if (state === 'ready') {
    ball.x = paddle.x + paddle.w / 2;
    return;
  }
  if (state !== 'playing') return;

  updateCapsules();

  // Main ball. If it falls while extra balls are still in play, one of them takes its place.
  if (stepBall(ball) === 'fell') {
    if (extraBalls.length > 0) {
      ball = extraBalls.shift();
    } else {
      lives--;
      updateHud();
      wideLeft = 0;
      slowLeft = 0;
      capsules = [];
      if (lives <= 0) {
        state = 'over';
      } else {
        state = 'ready';
        placeBallOnPaddle();
      }
      return;
    }
  }

  // Extra balls: remove the ones that fall
  extraBalls = extraBalls.filter(b => stepBall(b) !== 'fell');

  if (!endless && bricks.every(b => !b.alive)) {
    state = 'won';
  }
}

function drawCenterText(title, subtitle) {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, H / 2 - 60, W, 120);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Arial';
  ctx.fillText(title, W / 2, H / 2);
  ctx.font = '18px Arial';
  ctx.fillText(subtitle, W / 2, H / 2 + 35);
}

// Time bars for active timed power-ups, in the top-left corner of the field
function drawPowerupBars() {
  const bars = [];
  if (wideLeft > 0) bars.push({ label: 'WIDE', color: POWERUP_TYPES.W.color, frac: wideLeft / WIDE_MS });
  if (slowLeft > 0) bars.push({ label: 'SLOW', color: POWERUP_TYPES.S.color, frac: slowLeft / SLOW_MS });
  const BAR_X = 72;
  const BAR_W = 120;
  const BAR_H = 10;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px Arial';
  bars.forEach((bar, i) => {
    const y = 12 + i * 20;
    ctx.fillStyle = '#fff';
    ctx.fillText(bar.label, 10, y + BAR_H / 2);
    ctx.fillStyle = '#333';
    ctx.fillRect(BAR_X, y, BAR_W, BAR_H);
    ctx.fillStyle = bar.color;
    ctx.fillRect(BAR_X, y, BAR_W * bar.frac, BAR_H);
  });
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Bricks: base color, light top edge, dark bottom edge for a raised look
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(b.x, b.y, b.w, 4);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.fillRect(b.x, b.y + b.h - 4, b.w, 4);
  }

  // Falling power-up capsules
  ctx.font = 'bold 11px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const c of capsules) {
    ctx.fillStyle = POWERUP_TYPES[c.type].color;
    ctx.fillRect(c.x - CAPSULE_W / 2, c.y - CAPSULE_H / 2, CAPSULE_W, CAPSULE_H);
    ctx.fillStyle = '#000';
    ctx.fillText(c.type, c.x, c.y + 1);
  }
  ctx.textBaseline = 'alphabetic';

  // Particles from broken bricks
  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#ddd';
  ctx.fillRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H);

  ctx.fillStyle = '#fff';
  for (const b of allBalls()) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
    ctx.fill();
  }

  drawPowerupBars();
  if (state === 'ready') drawCenterText('BREAKOUT', 'Press Space or click to launch');
  if (state === 'over') {
    drawCenterText('GAME OVER', endless ? 'Final score: ' + score + '  |  Press Space to play again' : 'Press Space to play again');
  }
  if (state === 'won') drawCenterText('YOU WIN!', 'Press Space to play again');
  if (state === 'paused') drawCenterText('PAUSED', 'Press P to resume');
}

function loop(now) {
  const dt = lastFrameTime === null ? 0 : Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  if (state === 'playing') {
    tickPowerups(dt);
    if (endless) updateEndless(dt);
  }
  update();
  draw();
  requestAnimationFrame(loop);
}

// Keyboard
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === ' ') handleAction();
  if (e.repeat) return;
  if (e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === 'm' || e.key === 'M') muted = !muted;
  if ((e.key === 'i' || e.key === 'I') && state === 'ready') {
    endless = !endless;
    lives = endless ? 1 : 3;
    document.getElementById('endless-status').textContent = 'Endless: ' + (endless ? 'ON' : 'OFF');
    updateHud();
  }
});
document.addEventListener('keyup', e => {
  keys[e.key] = false;
});

// Mouse
canvas.addEventListener('mouseenter', () => {
  mouseInside = true;
  needsGlide = true; // glide in if the cursor re-enters at a different spot
});
canvas.addEventListener('mouseleave', () => {
  mouseInside = false; // paddle stays where it is
});
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  mouseTargetX = clamp(mx - paddle.w / 2, 0, W - paddle.w);
});
canvas.addEventListener('click', handleAction);

newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
